name: Safe Auto Merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    if: contains(github.event.pull_request.labels.*.name, 'ai-safe-automerge')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check changed files
        id: files
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {owner, repo, pull_number});
            core.setOutput('changed_files', files.map((file) => file.filename).join('\n'));
      - run: npm run pr:safety
        env:
          CHANGED_FILES: ${{ steps.files.outputs.changed_files }}
      - name: Queue merge after required checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --squash --auto --delete-branch
